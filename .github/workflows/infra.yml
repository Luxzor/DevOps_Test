# Infraestructura como código por pipeline: nunca desde la consola.
#
#   Pull Request: terraform plan de cada ambiente, publicado como comentario
#   push a main:  terraform apply en dev, luego staging, luego prod (con aprobación manual)
#   manual:       plan, apply o destroy de un ambiente
name: Infra

on:
  pull_request:
    paths:
      - infra/**
      - scripts/tf.sh
      - scripts/lib.sh
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - scripts/tf.sh
      - scripts/lib.sh
      - .github/workflows/infra.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        type: choice
        options: [dev, staging, prod]
        required: true
      action:
        description: Acción de Terraform
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: Para destroy, escribe el nombre del ambiente
        type: string
        default: ""

# Nunca dos operaciones de Terraform a la vez sobre el mismo estado.
concurrency:
  group: infra-${{ github.event.inputs.environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.13.3"
  TARGET: ${{ vars.DEPLOY_TARGET || 'local' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan · ${{ matrix.environment }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.DEPLOY_TARGET == 'aws' && '["ubuntu-latest"]' || '["self-hosted","sim"]') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    permissions:
      contents: read
      id-token: write
      pull-requests: write # publicar el plan como comentario
    env:
      ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Configuración del destino
        id: target
        run: scripts/gha-target.sh "$ENVIRONMENT" | tee -a "$GITHUB_OUTPUT"
      # Rol de solo lectura: un Pull Request nunca puede modificar infraestructura.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.target.outputs.plan_role }}
          role-session-name: plan-${{ matrix.environment }}-${{ github.run_id }}
          aws-region: ${{ steps.target.outputs.region }}
          sts-endpoint: ${{ steps.target.outputs.endpoint }}
      - run: scripts/tf.sh "$ENVIRONMENT" init
      - name: terraform plan
        id: plan
        run: |
          set +e
          scripts/tf.sh "$ENVIRONMENT" plan -no-color -lock-timeout=120s -detailed-exitcode -out=tfplan > plan.log 2>&1
          code=$?
          cat plan.log
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = sin cambios, 2 = hay cambios; cualquier otro valor es un error.
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
      - name: Comentar el plan en el Pull Request
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const marker = `<!-- terraform-plan-${env} -->`;
            let log = fs.existsSync('plan.log') ? fs.readFileSync('plan.log', 'utf8') : 'sin salida';
            const summary = (log.match(/^(Plan: .*|No changes\..*)$/m) || ['Error en el plan'])[0];
            const max = 60000;
            if (log.length > max) log = '... (recortado)\n' + log.slice(-max);
            const status = process.env.EXITCODE === '0' ? 'sin cambios'
              : process.env.EXITCODE === '2' ? 'con cambios' : 'ERROR';
            const body = `${marker}
            ### Terraform plan · \`${env}\` · ${status}
            **${summary}**

            <details><summary>Ver plan completo</summary>

            \`\`\`terraform
            ${log}
            \`\`\`
            </details>

            _Commit ${context.sha.slice(0, 7)} · destino \`${process.env.TARGET}\`_`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # El apply corre solo desde main y en orden: si dev falla, staging y prod no se tocan.
  apply-dev:
    if: github.event_name == 'push'
    uses: ./.github/workflows/terraform-apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev

  apply-staging:
    needs: apply-dev
    uses: ./.github/workflows/terraform-apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: staging

  apply-prod:
    needs: apply-staging
    uses: ./.github/workflows/terraform-apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod

  manual:
    name: Manual · ${{ inputs.action }} ${{ inputs.environment }}
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/terraform-apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
      confirm: ${{ inputs.confirm }}
