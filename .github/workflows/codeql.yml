# Análisis estático de seguridad (SAST) con CodeQL, para Python y para los propios workflows.
#
# Subir resultados a "Code scanning" requiere que el repositorio tenga GitHub Code Security
# (gratis en repositorios públicos, de pago en privados). Sin eso, el análisis igual corre y el
# job falla si encuentra problemas: define la variable CODEQL_UPLOAD=always para subirlos.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # lunes: detecta vulnerabilidades nuevas en código que no cambió

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ vars.CODEQL_UPLOAD || 'never' }}
          output: sarif
      - name: Fallar si hay hallazgos
        run: |
          count=$(jq '[.runs[].results[]] | length' sarif/*.sarif)
          jq -r '.runs[].results[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine // 1)::\(.ruleId): \(.message.text)"' sarif/*.sarif
          echo "### CodeQL (${{ matrix.language }}): $count hallazgos" >> "$GITHUB_STEP_SUMMARY"
          [ "$count" -eq 0 ]
