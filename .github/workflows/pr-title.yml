# El título del Pull Request debe seguir Conventional Commits (feat:, fix:, chore:, ...).
# Con squash merge, el título se convierte en el commit de main, y release-please lo usa
# para decidir la siguiente versión (fix = patch, feat = minor, ! o BREAKING CHANGE = major).
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
